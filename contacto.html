<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="icon" type="image/x-icon" href="assets/img/lienzo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-light">
    <div id="body" class="page-shell">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">Arte & Alma</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
              <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-5">
        <section class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow-sm border-0 py-4 px-3 px-md-5">
              <h1 class="text-center mb-4">Formulario de contacto</h1>
              <form id="formContacto" class="row g-3">
                <div class="col-md-6">
                  <label for="mensaje" class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" id="mensaje" placeholder="Escribe tu nombre" required />
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required />
                </div>

                <div class="col-12">
                  <label for="tipo" class="form-label">Tipo de consulta</label>
                  <select class="form-select" id="tipo" required>
                    <option value="" selected>Seleccione...</option>
                    <option value="Compra">Compra</option>
                    <option value="Consulta">Consulta</option>
                    <option value="Venta">Venta</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="comentario" class="form-label">Mensaje</label>
                  <textarea class="form-control" id="comentario" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
                </div>

                <div class="col-12 text-center">
                  <button type="submit" class="btn btn-dark px-4">Enviar mensaje</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
